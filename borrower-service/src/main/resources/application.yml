spring:
  application:
    name: borrower-service
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/borrower_db
    username: ${POSTGRES_USER:credit}
    password: ${POSTGRES_PASSWORD:credit}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      timeout: 500ms

grpc:
  server:
    port: 9101
