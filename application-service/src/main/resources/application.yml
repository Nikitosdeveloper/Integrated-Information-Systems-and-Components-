spring:
  application:
    name: application-service
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/application_db
    username: ${POSTGRES_USER:credit}
    password: ${POSTGRES_PASSWORD:credit}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      timeout: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:59092}
    consumer:
      group-id: application-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

grpc:
  server:
    port: 9102
  client:
    timeout-ms: 3000
    max-attempts: 3
    backoff-ms: 150

app:
  # при старте повторно запрашивает расчёт для заявок без рейтинга (тестовые данные и восстановление после сбоев)
  republish-unscored-on-start: ${REPUBLISH_UNSCORED:true}
